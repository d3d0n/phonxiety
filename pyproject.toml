[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "phonxiety"
version = "0.1.0"
description = "Standalone realtime voice agent for cellular calls through an Android phone"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
  "aiortc>=1.14,<2",
  "cryptography>=44",
  "fastmcp>=4.2.5,<5",
  "httpx>=0.28",
  "iroh>=1.2,<2",
  "jinja2>=3.1,<4",
  "pydantic>=2.11,<3",
  "segno>=1.6",
  "starlette>=0.47",
  "uvicorn>=0.35",
  "websockets>=15",
  "zeroconf>=0.154,<1",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-timeout>=2.3"]

[project.scripts]
phonxiety = "phonxiety.cli:main"
phonxietyd = "phonxiety.server:main"
phonxiety-mcp = "phonxiety.mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/phonxiety"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Every test carries a hard deadline: a blocked read or a shutdown that never ends
# fails with a stack instead of hanging the suite.
addopts = "--timeout=60 --timeout-method=thread"
