<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phonxiety module</title>
<style>
  :root {
    color-scheme: dark;
    --void: #0A0710; --signal: #FF4FD8; --trace: #F6D8FF;
    --plate: #5B2A86; --mute: #B99CCC; --surface: #170D23; --line: #3F2A52;
  }
  body { margin: 0; padding: 20px; background: var(--void); color: var(--trace);
         font: 15px/1.65 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  h1 { font: 600 18px/1.3 system-ui, sans-serif; letter-spacing: -0.016em; margin: 0 0 6px; }
  h1::before { content: "\2197"; color: var(--signal); margin-right: 6px; }
  .muted { color: var(--mute); font-size: 12px; line-height: 1.65;
           text-transform: uppercase; letter-spacing: 2.5px; }
  .card { background: var(--surface); border: 1px solid var(--line);
          padding: 14px 16px; margin: 14px 0;
          clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 0; vertical-align: top; }
  td:first-child { color: var(--mute); width: 44%; }
  td:last-child { word-break: break-all; }
  .ok { color: #86E7C3; } .bad { color: #FFB4A8; } .unknown { color: #FFC98A; }
  button { font: inherit; padding: 9px 14px; margin: 0 8px 8px 0; border: 1px solid var(--line);
           background: var(--plate); color: var(--trace);
           clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%); }
  button:active { background: #3B2152; }
  pre { white-space: pre-wrap; margin: 0; font-size: 12px; color: var(--mute); }
</style>
</head>
<body>
<h1>Phonxiety bridge</h1>
<div class="muted">Privileged Telecom/audio companion. Install, pairing and repair happen in the app.</div>

<div class="card">
  <table>
    <tr><td>Module</td><td id="module">reading…</td></tr>
    <tr><td>App package</td><td id="app">reading…</td></tr>
    <tr><td>Privileged location</td><td id="privapp">reading…</td></tr>
  </table>
</div>

<div class="card">
  <button id="doctor">Open Doctor</button>
  <button id="refresh">Refresh</button>
  <pre id="log"></pre>
</div>

<script>
(function () {
  var MODULE_DIR = "/data/adb/modules/phonxiety_bridge";
  var PKG = "com.phonxiety.bridge";
  var exec = (window.kernelsu && window.kernelsu.exec) ? window.kernelsu.exec : null;
  var logEl = document.getElementById("log");

  function set(id, text, cls) {
    var el = document.getElementById(id);
    el.textContent = text;
    el.className = cls || "";
  }

  function log(text) { logEl.textContent = text || ""; }

  function run(command) {
    if (!exec) return Promise.resolve(null);
    return exec(command).catch(function () { return null; });
  }

  function refresh() {
    if (!exec) {
      set("module", "Open this page from the KernelSU or APatch manager", "unknown");
      set("app", "WebUI shell is unavailable", "unknown");
      set("privapp", "WebUI shell is unavailable", "unknown");
      log("This manager does not expose the WebUI exec API.");
      return;
    }
    run("cat " + MODULE_DIR + "/module.prop").then(function (res) {
      if (!res || res.errno !== 0) { set("module", "not installed as a module", "bad"); return; }
      var version = "";
      res.stdout.split("\n").forEach(function (line) {
        if (line.indexOf("version=") === 0) version = line.substring(8).trim();
      });
      set("module", version ? "installed, version " + version : "installed", "ok");
    });
    run("pm path " + PKG).then(function (res) {
      if (!res || res.errno !== 0 || !res.stdout.trim()) {
        set("app", "not installed", "bad");
        set("privapp", "—", "unknown");
        return;
      }
      var path = res.stdout.trim().replace(/^package:/, "");
      set("app", path, "ok");
      set("privapp",
          path.indexOf("/system/priv-app/") === 0 ? "yes" : "no — the overlay is not mounted",
          path.indexOf("/system/priv-app/") === 0 ? "ok" : "bad");
    });
  }

  document.getElementById("refresh").addEventListener("click", refresh);
  document.getElementById("doctor").addEventListener("click", function () {
    run("am start -n " + PKG + "/.MainActivity --es phonxiety.route doctor").then(function (res) {
      if (!res || res.errno !== 0) log("Could not open the app; is it installed?");
    });
  });

  refresh();
})();
</script>
</body>
</html>
