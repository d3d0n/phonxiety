// Compose stability allowlist for the model types the screens hold.
//
// One type per line, no package wildcard: `AppGateway` lives in the same
// package and its `supportsAttachments` reads the live link, so a wildcard
// would let the compiler skip a screen that has to recompose.
//
// Every entry is a `data object`, a `data class`, or a sealed type whose
// implementations are only those: read-only `val` properties, no mutable
// collection, no `var`.  The collections held are read-only `List`/`Map`
// views and `JsonObject`/`JsonElement`; Kotlin does not make those immutable,
// so the promise this file makes is that every producer builds them fresh and
// never mutates one after handing it out.
