name: Android

# Job graph and caching policy.
#
# One workflow, two tiers, the same path filters and the same setup:
#
#   full (pull request, push to main, workflow_dispatch) — three jobs that run
#   in parallel, so the wall time is the slowest job, not their sum:
#       release — :app:assembleRelease, R8 mapping and the APK + module zip;
#       test    — testDebugUnitTest verifyRoborazziDebug and the test reports;
#       lint    — lint and the lint reports.
#   quick (push to feat/**) — debug APK and unit tests with -PskipScreenshots,
#   which leaves the screenshot captures out by JUnit category; no release
#   build, lint, Roborazzi verification or module zip.
#
# Every job starts with ./.github/actions/android-setup, which installs the
# Android SDK packages, the Rust/Java/Gradle toolchain from mise.toml and
# restores three caches:
#
#   android-sdk-…  NDK, platform, build-tools, platform-tools, licenses.
#                  Explicit restore/save: sdkmanager only fetches the packages
#                  the cache did not provide.
#   iroh-…         the iroh-ffi checkout, its cargo target dir, cargo-ndk and
#                  the generated .so + Kotlin.  The task's own stamp
#                  (.tools/iroh-build/.iroh-android.stamp) skips the ~6 minute
#                  cross-compile when the restored tree is current.
#   Gradle         gradle/actions/setup-gradle: dependencies, wrapper and the
#                  local build cache.  Default policy: only main writes, every
#                  branch and PR reads, one entry per job, saved by its post
#                  step even when the build fails.
#
# The two explicit caches are written with actions/cache/save guarded by
# `if: always()`, right after the step that produces them.  A job that fails
# later - a red test, a lint error - still leaves them cached; the old
# actions/cache steps saved only on a fully successful job, which is why no run
# ever stored anything and every run paid for the NDK download and the iroh
# cross-compile again.
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "android/**"
      - "mise-tasks/phone/**"
      - "mise.toml"
      - ".github/workflows/android.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "android/**"
      - "mise-tasks/phone/**"
      - "mise.toml"
      - ".github/workflows/android.yml"
      - ".github/actions/**"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full tier: pull requests, main and manual runs.  Release APK, R8 mapping
  # and the Magisk module zip.  Assembles only; the tests and lint run in their
  # own jobs against the same caches.
  release:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/android-setup

      # Materialises the release key from repository secrets when they exist.
      # Only names appear here; a missing secret leaves the build on the debug
      # key, and PHONXIETY_REQUIRE_SIGNING stays unset so that is allowed.
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.PHONXIETY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PHONXIETY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PHONXIETY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PHONXIETY_KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No release key in secrets; the APK is signed with the debug key."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          chmod 600 "$RUNNER_TEMP/keystore/release.jks"
          {
            echo "PHONXIETY_KEYSTORE=$RUNNER_TEMP/keystore/release.jks"
            echo "PHONXIETY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "PHONXIETY_KEY_ALIAS=$KEY_ALIAS"
            echo "PHONXIETY_KEY_PASSWORD=$KEY_PASSWORD"
            echo "PHONXIETY_REQUIRE_SIGNING=1"
          } >> "$GITHUB_ENV"

      - name: Assemble release APK
        working-directory: android
        run: |
          mise exec -- ./gradlew --no-daemon --console=plain :app:assembleRelease

      # R8 maps every obfuscated name back to its source; without it an on-device
      # crash report is unreadable.
      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phonxiety-r8-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      # Re-runs assembleRelease (up to date) and packages the module zip.
      - name: Package module zip
        run: mise run phone:build

      - name: Upload APK and module zip
        uses: actions/upload-artifact@v4
        with:
          name: phonxiety-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            dist/phonxiety-bridge-*.zip
          if-no-files-found: error

  # Unit tests plus Roborazzi screenshot verification.  The Roborazzi tasks are
  # selected by name so every module that renders a screen compares against its
  # committed images, not just the design system.
  test:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/android-setup

      - name: Unit tests and Roborazzi verification
        working-directory: android
        run: |
          mise exec -- ./gradlew --no-daemon --console=plain \
            testDebugUnitTest \
            verifyRoborazziDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phonxiety-android-test-reports
          path: |
            android/**/build/reports/tests/**
            android/**/build/test-results/**
          if-no-files-found: ignore

  # Static analysis only; lint needs the compiled sources, not the APK.
  lint:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/android-setup

      - name: Lint
        working-directory: android
        run: mise exec -- ./gradlew --no-daemon --console=plain lint

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phonxiety-android-lint-reports
          path: |
            android/**/build/reports/lint-results*.html
            android/**/build/reports/lint-results*.txt
          if-no-files-found: ignore

  # Quick tier: pushes to feat/** only.  The app still compiles against the
  # iroh bindings, so the setup is the same composite action and the same
  # caches; only the debug variant and the unit tests run, with
  # -PskipScreenshots leaving the Roborazzi-capturing classes out of the test
  # run.  Everything else in those classes still runs.
  quick:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/android-setup

      - name: Debug build and unit tests
        working-directory: android
        run: |
          mise exec -- ./gradlew --no-daemon --console=plain \
            :app:assembleDebug \
            testDebugUnitTest \
            -PskipScreenshots

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phonxiety-android-test-reports
          path: |
            android/**/build/reports/tests/**
            android/**/build/test-results/**
          if-no-files-found: ignore
